        stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Control buttons -->
  <circle cx="100" cy="135" r="6" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <circle cx="125" cy="135" r="8" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>
  <circle cx="150" cy="135" r="6" stroke="#FFFFFF" stroke-width="3.5" fill="none"/>

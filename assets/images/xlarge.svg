<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stove device outline with thick stroke -->
  <rect x="250" y="80" width="500" height="540" rx="40"
        stroke="#2a2a2a" stroke-width="22" fill="none"/>

  <!-- Inner screen/window -->
  <rect x="320" y="150" width="360" height="320" rx="30"
        stroke="#2a2a2a" stroke-width="17" fill="none"/>

  <!-- Flame outline with thick stroke -->
  <path d="M500 220 C500 180, 560 170, 560 320 C560 350, 530 370, 500 370 C470 370, 440 350, 440 320 C440 170, 500 180, 500 220 Z"
        stroke="#F57C00" stroke-width="15" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inner flame detail -->
  <path d="M500 260 C500 235, 530 230, 530 325 C530 340, 515 350, 500 350 C485 350, 470 340, 470 325 C470 230, 500 235, 500 260 Z"
        stroke="#F57C00" stroke-width="11" fill="none" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Control buttons -->
  <circle cx="400" cy="540" r="28" stroke="#2a2a2a" stroke-width="11" fill="none"/>
  <circle cx="500" cy="540" r="36" stroke="#2a2a2a" stroke-width="11" fill="none"/>
  <circle cx="600" cy="540" r="28" stroke="#2a2a2a" stroke-width="11" fill="none"/>
</svg>

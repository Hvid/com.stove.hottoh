<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background as required by Homey guidelines -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- Stove shadow on floor -->
  <ellipse cx="500" cy="960" rx="200" ry="30" fill="#000000" opacity="0.15"/>

  <!-- Stove body -->
  <rect x="300" y="120" width="400" height="760" rx="30" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="316" y="136" width="368" height="728" rx="20" fill="#353535"/>

  <!-- Glass window/door -->
  <rect x="358" y="180" width="284" height="440" rx="25" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="4"/>
  <rect x="372" y="194" width="256" height="412" rx="18" fill="#111111"/>

  <!-- Fire glow effect -->
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffdb44;stop-opacity:0.7" />
      <stop offset="50%" style="stop-color:#f8692b;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#f8692b;stop-opacity:0" />
    </radialGradient>
  </defs>

  <ellipse cx="500" cy="400" rx="160" ry="190" fill="url(#fireGlow)"/>

  <!-- Flames with multiple layers -->
  <path d="M410 450C410 350 500 332 500 270C500 332 590 350 590 450C590 510 545 540 500 540C455 540 410 510 410 450Z" fill="#f8692b"/>
  <path d="M430 450C430 370 500 356 500 294C500 356 570 370 570 450C570 500 535 524 500 524C465 524 430 500 430 450Z" fill="#fcae30"/>
  <path d="M450 450C450 390 500 378 500 320C500 378 550 390 550 450C550 485 525 504 500 504C475 504 450 485 450 450Z" fill="#ffdb44"/>
  <path d="M470 450C470 410 500 400 500 350C500 400 530 410 530 450C530 475 515 488 500 488C485 488 470 475 470 450Z" fill="#fffacd"/>

  <!-- Stove top -->
  <rect x="300" y="96" width="400" height="24" rx="12" fill="#3a3a3a"/>

  <!-- Stove legs -->
  <rect x="330" y="880" width="80" height="30" rx="12" fill="#3a3a3a"/>
  <rect x="590" y="880" width="80" height="30" rx="12" fill="#3a3a3a"/>

  <!-- Control panel -->
  <circle cx="500" cy="680" r="24" fill="#505050" stroke="#3a3a3a" stroke-width="3"/>
  <circle cx="440" cy="680" r="15" fill="#505050"/>
  <circle cx="560" cy="680" r="15" fill="#505050"/>

  <!-- Status LED indicator (on) -->
  <circle cx="500" cy="680" r="7" fill="#4ade80"/>

  <!-- Pellet container -->
  <rect x="680" y="220" width="36" height="150" rx="10" fill="#3a3a3a"/>
  <rect x="688" y="228" width="20" height="134" rx="6" fill="#4a4a4a"/>

  <!-- Airflow vents -->
  <rect x="324" y="220" width="20" height="8" rx="3" fill="#2a2a2a"/>
  <rect x="324" y="238" width="20" height="8" rx="3" fill="#2a2a2a"/>
  <rect x="324" y="256" width="20" height="8" rx="3" fill="#2a2a2a"/>
  <rect x="324" y="274" width="20" height="8" rx="3" fill="#2a2a2a"/>
  <rect x="324" y="292" width="20" height="8" rx="3" fill="#2a2a2a"/>
</svg>

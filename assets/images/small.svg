<?xml version="1.0" encoding="UTF-8"?>
<svg width="250" height="175" viewBox="0 0 250 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - warm ambient room -->
  <rect width="250" height="175" fill="#e8dcc8"/>

  <!-- Wall with texture -->
  <rect x="0" y="0" width="250" height="120" fill="#c9b89a"/>
  <rect x="0" y="0" width="250" height="120" fill="url(#wallTexture)" opacity="0.3"/>

  <!-- Wood floor -->
  <rect x="0" y="120" width="250" height="55" fill="#8b6f47"/>
  <line x1="0" y1="130" x2="250" y2="130" stroke="#73563a" stroke-width="1"/>
  <line x1="0" y1="145" x2="250" y2="145" stroke="#73563a" stroke-width="1"/>
  <line x1="0" y1="160" x2="250" y2="160" stroke="#73563a" stroke-width="1"/>

  <!-- Subtle furniture shadow on left -->
  <ellipse cx="30" cy="140" rx="25" ry="15" fill="#000000" opacity="0.1"/>

  <!-- Stove shadow on floor -->
  <ellipse cx="125" cy="158" rx="42" ry="8" fill="#000000" opacity="0.2"/>

  <!-- Stove body -->
  <rect x="85" y="25" width="80" height="110" rx="6" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="89" y="29" width="72" height="102" rx="4" fill="#353535"/>

  <!-- Glass window -->
  <rect x="97" y="38" width="56" height="70" rx="5" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="1"/>
  <rect x="100" y="41" width="50" height="64" rx="3" fill="#111111"/>

  <!-- Glowing flames with warm light -->
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffdb44;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#f8692b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f8692b;stop-opacity:0" />
    </radialGradient>
    <pattern id="wallTexture" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="none"/>
      <circle cx="10" cy="10" r="1" fill="#ffffff" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Fire glow effect -->
  <ellipse cx="125" cy="75" rx="35" ry="40" fill="url(#fireGlow)"/>

  <!-- Flames -->
  <path d="M107 85C107 70 125 67 125 57C125 67 143 70 143 85C143 93 134 97 125 97C116 97 107 93 107 85Z" fill="#f8692b"/>
  <path d="M111 85C111 73 125 71 125 61C125 71 139 73 139 85C139 91 132 94 125 94C118 94 111 91 111 85Z" fill="#fcae30"/>
  <path d="M115 85C115 76 125 74 125 65C125 74 135 76 135 85C135 89 130 91 125 91C120 91 115 89 115 85Z" fill="#ffdb44"/>

  <!-- Stove top -->
  <rect x="85" y="20" width="80" height="5" rx="2" fill="#3a3a3a"/>

  <!-- Stove legs -->
  <rect x="90" y="135" width="15" height="5" rx="2" fill="#3a3a3a"/>
  <rect x="145" y="135" width="15" height="5" rx="2" fill="#3a3a3a"/>

  <!-- Control panel -->
  <circle cx="125" cy="118" r="4" fill="#505050" stroke="#3a3a3a" stroke-width="0.5"/>
  <circle cx="112" cy="118" r="2.5" fill="#505050"/>
  <circle cx="138" cy="118" r="2.5" fill="#505050"/>

  <!-- Pellet container side -->
  <rect x="152" y="45" width="10" height="25" rx="2" fill="#3a3a3a"/>

  <!-- Light glow on wall from fire -->
  <ellipse cx="125" cy="60" rx="70" ry="50" fill="#f8692b" opacity="0.08"/>
</svg>

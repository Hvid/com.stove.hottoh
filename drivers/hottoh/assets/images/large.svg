<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White background as required by Homey guidelines -->
  <rect width="500" height="500" fill="#FFFFFF"/>

  <!-- Stove shadow -->
  <ellipse cx="250" cy="480" rx="100" ry="15" fill="#000000" opacity="0.15"/>

  <!-- Stove body -->
  <rect x="140" y="60" width="220" height="380" rx="16" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="150" y="70" width="200" height="360" rx="12" fill="#353535"/>

  <!-- Glass window -->
  <rect x="175" y="95" width="150" height="220" rx="12" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="2"/>
  <rect x="183" y="103" width="134" height="204" rx="8" fill="#111111"/>

  <!-- Fire glow -->
  <defs>
    <radialGradient id="fireGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffdb44;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#f8692b;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#f8692b;stop-opacity:0" />
    </radialGradient>
  </defs>

  <ellipse cx="250" cy="205" rx="80" ry="95" fill="url(#fireGlow)"/>

  <!-- Flames -->
  <path d="M205 230C205 180 250 172 250 140C250 172 295 180 295 230C295 255 273 268 250 268C227 268 205 255 205 230Z" fill="#f8692b"/>
  <path d="M215 230C215 190 250 184 250 152C250 184 285 190 285 230C285 250 268 260 250 260C232 260 215 250 215 230Z" fill="#fcae30"/>
  <path d="M225 230C225 200 250 194 250 165C250 194 275 200 275 230C275 245 263 252 250 252C237 252 225 245 225 230Z" fill="#ffdb44"/>
  <path d="M235 230C235 208 250 203 250 178C250 203 265 208 265 230C265 240 258 244 250 244C242 244 235 240 235 230Z" fill="#fffacd"/>

  <!-- Stove top -->
  <rect x="140" y="48" width="220" height="12" rx="6" fill="#3a3a3a"/>

  <!-- Stove legs -->
  <rect x="155" y="440" width="40" height="15" rx="6" fill="#3a3a3a"/>
  <rect x="305" y="440" width="40" height="15" rx="6" fill="#3a3a3a"/>

  <!-- Control panel -->
  <circle cx="250" cy="350" r="12" fill="#505050" stroke="#3a3a3a" stroke-width="1"/>
  <circle cx="215" cy="350" r="7" fill="#505050"/>
  <circle cx="285" cy="350" r="7" fill="#505050"/>

  <!-- Status LED (on) -->
  <circle cx="250" cy="350" r="3" fill="#4ade80"/>

  <!-- Pellet container -->
  <rect x="340" y="110" width="18" height="75" rx="5" fill="#3a3a3a"/>
  <rect x="344" y="115" width="10" height="65" rx="3" fill="#4a4a4a"/>

  <!-- Airflow vents -->
  <rect x="158" y="110" width="10" height="4" rx="1" fill="#2a2a2a"/>
  <rect x="158" y="120" width="10" height="4" rx="1" fill="#2a2a2a"/>
  <rect x="158" y="130" width="10" height="4" rx="1" fill="#2a2a2a"/>
  <rect x="158" y="140" width="10" height="4" rx="1" fill="#2a2a2a"/>
</svg>

name: Update Homey App Version
on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        type: string
        description: Changelog
        required: true

# Needed in order to push the commit and create a release
permissions:
  contents: write

jobs:
  main:
    name: Update Homey App Version
    runs-on: ubuntu-latest
    steps:
      # The token is not stored in .git/config, so the version action cannot read it; the push step passes it explicitly
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Update Homey App Version
        uses: athombv/github-action-homey-app-version@3342f092b437550e78074797b52fac6467a456e1 # master (v2) as of 2026-10-26
        id: update_app_version
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Commit & Push
        env:
          VERSION: ${{ steps.update_app_version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only already-tracked files; never commit new files the action may leave in the workspace
          git add -u
          git commit -m "Update Homey App Version to v${VERSION}"
          git tag "v${VERSION}"

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD --tags
          gh release create "v${VERSION}" -t "v${VERSION}" --notes "" --generate-notes
